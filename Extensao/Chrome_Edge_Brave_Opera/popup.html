<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAF Assistente</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { width: 300px; background: #0f172a; color: #f8fafc; padding: 14px; }
        .header { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header img { width: 32px; height: 32px; border-radius: 8px; }
        .header h1 { font-size: 15px; font-weight: 700; color: #6ee7b7; }
        .header p { font-size: 11px; color: #94a3b8; }
        .status-box { margin: 12px 0; background: rgba(16, 185, 129, 0.12); border: 1px solid #10b981; padding: 10px; border-radius: 8px; font-size: 11.5px; color: #a7f3d0; text-align: center; }
        .btn-list { display: flex; flex-direction: column; gap: 8px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-portal { background: #0284c7; color: white; }
        .btn-portal:hover { background: #0369a1; }
        .btn-pix { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; }
        .btn-pix:hover { opacity: 0.92; }
        .footer { margin-top: 12px; text-align: center; font-size: 10px; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <img src="icons/icon.svg" alt="CAF">
        <div>
            <h1>CAF Assistente</h1>
            <p>Automação &amp; Produtividade</p>
        </div>
    </div>

    <div class="status-box">
        ✓ <strong>Ativo e Pronto</strong><br>
        Abre automaticamente ao acessar o CAF oficial!
    </div>

    <div class="btn-list">
        <a href="https://caf.mda.gov.br/" target="_blank" class="btn btn-portal">
            🏛️ Abrir Portal CAF MDA
        </a>
    </div>

    <div class="footer">
        Desenvolvido por João Vitor Toledo
    </div>
</body>
</html>
