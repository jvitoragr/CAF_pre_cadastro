<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#022c22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="350" rx="16" fill="url(#grad)" stroke="#10b981" stroke-width="2" />
  
  <!-- Círculos decorativos -->
  <circle cx="530" cy="70" r="90" fill="#10b981" opacity="0.1" />
  <circle cx="70" cy="300" r="110" fill="#059669" opacity="0.15" />
  
  <!-- Selo Patrocinador -->
  <rect x="30" y="25" width="120" height="24" rx="12" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1" />
  <text x="90" y="41" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">PARCEIRO OFICIAL</text>
  
  <!-- Título do Anúncio -->
  <text x="30" y="90" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff">AGRO PINHEIROS</text>
  <text x="30" y="118" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#a7f3d0">Insumos, Mudas de Café &amp; Consultoria</text>
  
  <!-- Descrição -->
  <text x="30" y="165" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">✓ Adubação especializada e análise de solo</text>
  <text x="30" y="195" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">✓ Condições especiais com Pronaf e CAF</text>
  <text x="30" y="225" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">✓ Atendimento em todo o Espírito Santo</text>
  
  <!-- Botão de Ação -->
  <rect x="30" y="265" width="220" height="48" rx="12" fill="url(#btnGrad)" />
  <text x="140" y="295" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Falar no WhatsApp ➔</text>
  
  <!-- Ícone/Marca -->
  <text x="500" y="295" font-family="-apple-system, sans-serif" font-size="60" text-anchor="middle">🌱</text>
</svg>