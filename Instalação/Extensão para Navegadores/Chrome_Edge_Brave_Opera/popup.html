<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CAF Assistente</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      font-size: 18px;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 700;
      background: linear-gradient(120deg, #60a5fa, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 14px 0;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #10b981;
      margin-top: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">C</div>
    <div>
      <h1>CAF Assistente</h1>
      <div style="font-size: 10px; color: #64748b;">Versão 5.2.0 (Ofuscada)</div>
    </div>
  </div>
  <p>O assistente é ativado automaticamente ao acessar o portal oficial do CAF.</p>
  <a href="https://caf.mda.gov.br/" target="_blank" class="btn">Acessar caf.mda.gov.br</a>
  <div class="status">
    <span class="dot"></span>
    Extensão Pronta e Ativa
  </div>
</body>
</html>
